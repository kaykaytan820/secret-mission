<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Mission</title>
<style>
  :root{
    --ink:#28231f;
    --muted:#766d65;
    --paper:#fbf8f3;
    --card:#fffdf9;
    --line:#ded5ca;
    --accent:#8a6f58;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(138,111,88,.09), transparent 30%),
      radial-gradient(circle at 90% 85%, rgba(138,111,88,.08), transparent 28%),
      var(--paper);
    padding:22px;
  }
  .wrap{width:min(100%,480px)}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:24px;
    padding:36px 28px; box-shadow:0 18px 60px rgba(55,43,34,.10);
    text-align:center;
  }
  .lock{font-size:34px; margin-bottom:10px}
  h1{font-size:29px; letter-spacing:.08em; margin:0 0 7px}
  .sub{color:var(--muted); font-size:14px; letter-spacing:.12em; margin-bottom:34px}
  label{display:block;text-align:left;font-size:14px;margin:0 0 8px 4px;color:var(--muted)}
  input{
    width:100%; padding:15px 16px; border:1px solid var(--line); border-radius:14px;
    background:#fff; font-size:17px; outline:none; color:var(--ink);
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; margin-top:14px; padding:15px 18px; border:0; border-radius:14px;
    background:var(--ink); color:white; font-size:15px; font-weight:700;
    letter-spacing:.08em; cursor:pointer;
  }
  button:active{transform:translateY(1px)}
  #mission{display:none}
  .hello{color:var(--muted);font-size:15px;margin-bottom:20px}
  .rule{height:1px;background:var(--line);margin:20px 0 25px}
  .zh{font-family:"Noto Serif SC","Songti SC",serif;font-size:21px;line-height:1.75;font-weight:600}
  .en{font-size:17px;line-height:1.65;font-style:italic;color:#4f4842;margin-top:18px}
  .reward{
    display:inline-block;margin-top:27px;padding:10px 18px;border:1px solid var(--line);
    border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.05em
  }
  .secret{margin-top:22px;color:var(--muted);font-size:13px}
  .tiny{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
  .error{height:18px;color:#9b4d45;font-size:12px;margin-top:7px}
  .fade{animation:fade .55s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="welcome">
    <div class="lock">🔐</div>
    <h1>SECRET MISSION</h1>
    <div class="sub">今晚的专属神秘任务</div>
    <label for="name">Enter your name / 输入你的名字</label>
    <input id="name" maxlength="40" autocomplete="name" placeholder="Your name">
    <button onclick="reveal()">REVEAL MY MISSION</button>
    <div class="error" id="error"></div>
  </section>

  <section class="card fade" id="mission">
    <div class="lock">🥂</div>
    <h1>YOUR SECRET MISSION</h1>
    <div class="hello" id="hello"></div>
    <div class="rule"></div>
    <div class="zh">分别找 <strong>3个人</strong> 主动碰杯，并成功让他们说出<strong>不同的祝酒词</strong>。</div>
    <div class="en">Clink glasses with <strong>3 different people</strong> and get each of them to make a <strong>different toast</strong>.</div>
    <div class="reward">REWARD · +50 CHIPS</div>
    <div class="secret">🤫 Keep your mission a secret.</div>
  </section>
  <div class="tiny">One QR code · One secret mission</div>
</div>
<script>
function reveal(){
  const input=document.getElementById('name');
  const name=input.value.trim();
  if(!name){
    document.getElementById('error').textContent='Please enter your name first.';
    input.focus(); return;
  }
  localStorage.setItem('secretMissionName',name);
  document.getElementById('hello').textContent='Good luck, ' + name + '!';
  document.getElementById('welcome').style.display='none';
  document.getElementById('mission').style.display='block';
}
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')reveal()});
</script>
</body>
</html>
